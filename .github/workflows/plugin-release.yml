name: Plugin release

on:
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:telemetry-server
      - run: npm run build:plugin
      - run: npm run check:plugin
      - run: npm run check:package
      - name: Verify tag matches plugin version
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('plugin/package.json','utf8')).version")"
          test "$GITHUB_REF_NAME" = "plugin-v$version"
      - name: Build plugin archive
        shell: bash
        run: |
          mkdir -p release
          (cd plugin && zip -qr "../release/codex-skills-${GITHUB_REF_NAME}.zip" .)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "release/codex-skills-${GITHUB_REF_NAME}.zip" --generate-notes
