# Add this zone in the http{} context, then attach the exact location below
# inside the public HTTPS server{} block. If the site has a server-level method
# gate, it must allow POST; keep location / restricted to GET/HEAD so GitHub
# mirror requests stay read-only.
limit_req_zone $binary_remote_addr zone=codex_skills_telemetry:10m rate=2r/s;

location = /api/skill-usage/v1/batch {
    client_max_body_size 256k;
    limit_except POST {
        deny all;
    }
    limit_req zone=codex_skills_telemetry burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:18990/v1/skill-usage;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    access_log off;
}
