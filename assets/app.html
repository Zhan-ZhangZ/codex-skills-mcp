<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex Skills 技能库</title>
  <style>@layer base{:root{color-scheme:light dark;--background: var( --color-background-primary, light-dark(rgb(255 255 255), rgb(24 24 24)) );--foreground: var( --color-text-primary, light-dark(rgb(26 28 31), rgb(255 255 255)) );--card: color-mix(in oklab, var(--foreground) 5%, var(--background));--card-foreground: var(--color-text-primary, var(--foreground));--primary: var( --color-text-info, light-dark(rgb(51 156 255), rgb(131 195 255)) );--primary-foreground: var( --color-text-inverse, light-dark(rgb(255 255 255), rgb(13 13 13)) );--secondary: var( --color-background-secondary, light-dark(rgb(255 255 255 / 96%), rgb(54 54 54 / 96%)) );--secondary-foreground: var(--color-text-primary, var(--foreground));--muted: color-mix(in srgb, var(--foreground) 10%, transparent);--muted-foreground: var( --color-text-secondary, light-dark(rgb(26 28 31 / 49.4%), rgb(255 255 255 / 49.8%)) );--accent: var( --color-background-info, light-dark(rgb(229 242 255), rgb(13 39 63)) );--accent-foreground: var(--color-text-info, var(--primary));--destructive: var( --color-text-warning, light-dark(rgb(226 85 7), rgb(255 133 73)) );--border: var( --color-border-secondary, light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%)) );--input: var( --color-border-primary, light-dark(rgb(26 28 31 / 11.8%), rgb(255 255 255 / 12%)) );--ring: var(--color-ring-primary, var(--primary));--font-size-base: var(--font-text-md-size, 14px);--radius: var(--border-radius-lg, 12.5px)}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}body{margin:0;color:var(--foreground);background:var(--background);font-size:max(11px,var(--font-size-base));font-weight:var(--font-weight-normal, 430);line-height:1.5}body,body>*{font-family:var( --font-sans, -apple-system, system-ui, "Segoe UI", sans-serif )}h1,h2,h3,p{margin-block:0}h1,h2,h3{font-weight:var(--font-weight-medium, 500);line-height:1.25}h1{font-size:calc(var(--font-size-base) * 1.7142857143)}h2{font-size:calc(var(--font-size-base) * lipse(1.5);color:var(--foreground);background:var(--secondary)}.form-control::placeholder{color:var(--muted-foreground)}.form-select{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-repeat:no-repeat;background-size:4px 4px;cursor:var(--cursor-interaction, pointer)}.form-select:not(:disabled):hover{background-color:color-mix(in srgb,var(--foreground) 6%,var(--secondary))}textarea.form-control{min-height:72px;padding:8px 10px;resize:vertical}.form-control:focus-visible,.form-select:focus-visible{border-color:var(--ring);box-shadow:inset 0 0 0 1px var(--ring)}.form-check{display:flex;min-height:20px;align-items:center;gap:8px}.form-check-input{appearance:none;display:grid;width:16px;height:16px;flex:0 0 auto;place-items:center;margin:0;border:1px solid var(--input);border-radius:5px;corner-shape:superellipse(1.5);color:var(--primary-foreground);background:var(--secondary);cursor:var(--cursor-interaction, pointer)}.form-check-input:checked{border-color:var(--primary);background:var(--primary)}.form-check-input:checked:after{width:7px;height:4px;border-bottom:2px solid currentColor;border-left:2px solid currentColor;content:"";transform:translateY(-1px) rotate(-45deg)}.form-check-input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}.form-check-label{color:var(--foreground)}svg.lucide{display:block;width:16px;height:16px;flex:none;stroke-width:1.6}.text-small{font-size:max(11px,calc(var(--font-size-base) - 2px))}.text-muted{color:var(--muted-foreground)}.text-destructive{color:var(--destructive)}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}}

  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 14px var(--font-sans, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif);
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh; padding: clamp(12px, 3vw, 24px); max-width: 1200px; margin: 0 auto;
    }
    [hidden] { display: none !important; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 18px; font-weight: 650; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .muted { color: var(--muted-foreground); font-size: 12px; }
    button, input {
      font: inherit; border: 1px solid var(--input);
      border-radius: 9px; padding: 8px 12px;
      background: var(--secondary); color: inherit;
    }
    button { cursor: var(--cursor-interaction, pointer); }
    button:hover:not(:disabled) { border-color: var(--primary); }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    button:disabled { opacity: .45; cursor: default; }
    #search { width: 100%; margin-bottom: 14px; }
    #cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 9px; margin-bottom: 18px; }
    .cat {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 13px; border-radius: 10px; text-align: left;
      border: 1px solid var(--border);
      background: var(--secondary);
    }
    .cat b { font-weight: 600; font-size: 13.5px; }
    #cards, #cards-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 9px; }
    .card {
      padding: 12px 13px; border-radius: 10px; text-align: left;
      border: 1px solid var(--border);
      background: var(--secondary);
      display: flex; flex-direction: column; gap: 6px;
    }
    .card b { overflow-wrap: anywhere; font-size: 13.5px; font-weight: 600; }
    .card p { font-size: 12px; line-height: 1.5; opacity: .72;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .badge {
      align-self: flex-start; font-size: 10.5px; padding: 2px 8px; border-radius: 99px;
      border: 1px solid var(--border);
    }
    .badge.on { border-color: light-dark(#277a38, #78d68b); color: light-dark(#277a38, #78d68b); }
    .badge.warn { border-color: light-dark(#a45b00, #f3b35c); color: light-dark(#a45b00, #f3b35c); }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    .download-progress {
      margin: 0 0 13px; padding: 11px 12px; border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--primary) 32%, var(--border));
      background: color-mix(in srgb, var(--primary) 7%, var(--secondary));
    }
    .download-progress-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .download-progress-head strong { font-size: 12.5px; font-weight: 650; }
    #d-progress-percent { color: var(--primary); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .download-track {
      height: 9px; overflow: hidden; border-radius: 99px;
      background: color-mix(in srgb, var(--foreground) 11%, transparent);
    }
    #d-progress-fill {
      width: 0%; height: 100%; border-radius: inherit;
      background: var(--primary); transition: width .35s ease;
    }
    .download-progress.indeterminate #d-progress-fill {
      width: 34%; animation: download-slide 1.25s ease-in-out infinite;
    }
    .download-progress-meta { margin-top: 6px; font-size: 11.5px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    @keyframes download-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(330%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #d-progress-fill { transition: none; }
      .download-progress.indeterminate #d-progress-fill { animation-duration: 2.5s; }
    }
    #detail pre {
      white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.65;
      padding: 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--secondary); max-height: 55vh; overflow: auto;
    }
    .doc-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 7px; }
    .doc-toolbar button { padding: 4px 9px; font-size: 11.5px; }
    .markdown {
      font-size: 13px; line-height: 1.72; padding: 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--secondary);
      max-height: 58vh; overflow: auto; overflow-wrap: anywhere;
    }
    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { line-height: 1.35; margin: 1.15em 0 .45em; }
    .markdown h1 { font-size: 1.45em; }
    .markdown h2 { font-size: 1.22em; }
    .markdown h3 { font-size: 1.08em; }
    .markdown p, .markdown ul, .markdown ol, .markdown blockquote, .markdown table { margin: .6em 0; }
    .markdown ul, .markdown ol { padding-left: 1.5em; }
    .markdown li + li { margin-top: .22em; }
    .markdown code {
      font: .92em ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: .12em .35em; border-radius: 4px; background: color-mix(in srgb, var(--foreground) 10%, transparent);
    }
    .markdown pre { max-height: none; overflow: auto; padding: 11px; margin: .75em 0; }
    .markdown pre code { padding: 0; background: transparent; }
    .markdown blockquote { padding-left: 11px; border-left: 3px solid var(--border); color: var(--muted-foreground); }
    .markdown table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; }
    .markdown th, .markdown td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
    .markdown a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
    .markdown hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
    .detail-tabs {
      display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: thin;
    }
    .detail-tabs button {
      border: 0; border-bottom: 2px solid transparent; border-radius: 7px 7px 0 0;
      background: transparent; padding: 9px 13px; white-space: nowrap;
    }
    .detail-tabs button[aria-selected="true"] {
      border-bottom-color: var(--primary); background: var(--secondary); font-weight: 600;
    }
    .detail-pane { min-height: 160px; }
    .detail-summary { color: var(--muted-foreground); font-size: 12px; line-height: 1.55; flex: 1; min-width: 0; }
    .explorer-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    #nav-search { flex: 1; min-width: 0; }
    #nav-count { white-space: nowrap; }
    #breadcrumb { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 9px; min-height: 30px; }
    #breadcrumb button { padding: 4px 8px; font-size: 12px; background: transparent; }
    #breadcrumb span { color: var(--muted-foreground); }
    .nav-list { display: grid; gap: 6px; }
    .nav-row {
      width: 100%; padding: 9px 11px; text-align: left; border: 1px solid var(--border);
      background: var(--secondary); border-radius: 9px;
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 9px; align-items: center;
    }
    .nav-row:hover:not(:disabled) { background: color-mix(in srgb, var(--secondary) 88%, var(--primary)); }
    .nav-icon { font-size: 15px; }
    .nav-copy { min-width: 0; }
    .nav-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
    .nav-description {
      display: block; margin-top: 2px; color: var(--muted-foreground); font-size: 11.5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nav-size { color: var(--muted-foreground); font-size: 11px; white-space: nowrap; }
    #nav-empty { padding: 18px 8px; color: var(--muted-foreground); line-height: 1.65; }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .pager span { color: var(--muted-foreground); font-size: 12px; text-align: center; }
    #file-preview {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .preview-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; }
    .preview-toolbar strong { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 12.5px; }
    .preview-toolbar button { padding: 5px 9px; font-size: 12px; }
    #preview-content { max-height: 42vh; }
    footer { margin-top: 16px; font-size: 12px; color: var(--muted-foreground); display: flex; align-items: center; gap: 10px; }
    #d-attach-status { margin-bottom: 12px; overflow-wrap: anywhere; }
    #empty { padding: 24px 0; line-height: 1.7; color: var(--muted-foreground); }
    #search-more { display: block; margin: 12px auto 0; }
    #retry { flex-shrink: 0; }
    @media (max-width: 480px) {
      header { flex-wrap: wrap; } #count { width: 100%; }
      .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
      #d-cached { grid-column: 1; grid-row: 1; justify-self: start; }
      #d-attach { grid-column: 2; grid-row: 1; }
      #d-cache-detail { grid-column: 1 / -1; grid-row: 2; }
      .explorer-toolbar { align-items: stretch; flex-direction: column; }
      #nav-count { align-self: flex-end; }
      .pager span { flex: 1; }
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
  <body>
    <header>
      <button id="back" hidden>← 返回</button>
      <h1 id="heading" tabindex="-1">Codex Skills 技能库</h1>
      <span class="muted" id="count"></span>
    </header>

    <label for="search" class="sr-only">搜索技能</label>
    <input id="search" type="search" maxlength="500" autocomplete="off" spellcheck="false" placeholder="搜索技能（中英文、功能描述…）" disabled />

    <main id="content" aria-busy="true">

    <section id="home">
      <p class="muted" style="margin-bottom:10px">常用技能</p>
      <div id="cards" style="margin-bottom:18px"></div>
      <p class="muted" style="margin-bottom:10px">全部分类</p>
      <div id="cats"></div>
    </section>

    <section id="list" hidden>
      <div id="cards-list"></div>
      <p id="empty" hidden></p>
      <button id="search-more" hidden>加载更多搜索结果</button>
    </section>

    <section id="detail" hidden>
      <div class="toolbar">
        <span class="badge" id="d-cached">检查缓存…</span>
        <span class="detail-summary" id="d-cache-detail"></span>
        <button id="d-attach">加入对话</button>
      </div>
      <div id="d-progress" class="download-progress indeterminate" role="progressbar"
        aria-label="技能缓存进度" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="download-progress-head">
          <strong>正在缓存完整技能</strong>
          <span id="d-progress-percent">准备中</span>
        </div>
        <div class="download-track"><div id="d-progress-fill"></div></div>
        <div id="d-progress-meta" class="download-progress-meta">正在读取文件清单…</div>
      </div>
      <p id="d-attach-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
      <div class="detail-tabs" role="tablist" aria-label="技能详情">
        <button id="tab-instructions" role="tab" aria-selected="true" aria-controls="instructions-pane">使用说明</button>
        <button id="tab-files" role="tab" aria-selected="false" aria-controls="explorer-pane" tabindex="-1">文件</button>
        <button id="tab-sub-skills" role="tab" aria-selected="false" aria-controls="explorer-pane" tabindex="-1">子技能</button>
      </div>
      <section id="instructions-pane" class="detail-pane" role="tabpanel" aria-labelledby="tab-instructions">
        <p id="d-revision-note" class="detail-summary" role="note" hidden></p>
        <div class="doc-toolbar">
          <span class="muted">Markdown 安全渲染</span>
          <button id="doc-toggle">查看原文</button>
        </div>
        <div id="d-md-rendered" class="markdown" tabindex="0" aria-label="技能说明预览">正在下载并读取完整技能…</div>
        <pre id="d-md" tabindex="0" aria-label="技能说明原文" hidden>正在下载并读取完整技能…</pre>
      </section>
      <section id="explorer-pane" class="detail-pane" role="tabpanel" aria-labelledby="tab-files" hidden>
        <div class="explorer-toolbar">
          <label for="nav-search" class="sr-only" id="nav-search-label">在当前技能中搜索</label>
          <input id="nav-search" type="search" maxlength="500" autocomplete="off" spellcheck="false" placeholder="搜索文件或子技能…" />
          <span class="muted" id="nav-count" role="status" aria-live="polite"></span>
        </div>
        <nav id="breadcrumb" aria-label="当前位置"></nav>
        <section id="file-preview" aria-label="文件内容预览" hidden>
          <div class="preview-toolbar">
            <strong id="preview-path"></strong>
            <button id="preview-more" hidden>加载更多</button>
            <button id="preview-copy">复制路径</button>
            <button id="preview-close">关闭</button>
          </div>
          <pre id="preview-content" tabindex="0">正在读取…</pre>
        </section>
        <div id="nav-list" class="nav-list"></div>
        <p id="nav-empty" hidden></p>
        <div class="pager">
          <button id="nav-prev" hidden>上一页</button>
          <span id="nav-page-info"></span>
          <button id="nav-next" hidden>下一页</button>
        </div>
      </section>
    </section>

    </main>
    <footer>
      <span id="status" role="status" aria-live="polite" aria-atomic="true">连接中…</span>
      <button id="retry" hidden>重试</button>
    </footer>
